<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Bahasa Sangihe</title>

<style>
*{box-sizing:border-box;}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: "Noto Sans", Arial, sans-serif;
  background-color: #777777; /* 背景色：グレー */
}

.header {
  padding: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h2 {
  margin: 0;
  font-size: 18px;
  color: #ffffff; /* タイトル色：白 */
}

#clearAllTop {
  padding: 6px 12px;
  border: 2px solid #ccc;
  border-radius: 6px;
  background: #f8f9fa;
  font-size: 12px;
  cursor: pointer;
}

#editor{
  flex:1;
  margin:6px;
  padding:10px;
  border:2px solid #ccc;
  border-radius:10px;
  font-size:20px;
  white-space:pre-wrap;
  overflow:auto;
  word-break:break-word;
  outline: none;
  background-color: #ffffff; /* テキストボックス：白 */
  color: #000000; /* 文字色：黒 */
}

/* caret */
#caret{
  display:inline-block;
  width:1px;
  height:1.2em;
  background:#000; /* カーソル色：黒 */
  animation:blink 1.2s steps(1) infinite;
  vertical-align:bottom;
}

@keyframes blink{
  50%{opacity:0}
}

/* keyboard */
.keyboard{
  margin:6px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.row{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
}

.key{
  height:42px;
  border:2px solid #ccc;
  border-radius:8px;
  background:#f8f9fa;
  font-weight:600;
  font-size:14px;
  user-select:none;
}

.key.active{
  background:#4dabf7;
  color:#fff;
}

/* ROW1 */
.row1{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
}

.salins{
  grid-column:span 4;
}

.arrow{grid-column:span 1;}
.del{grid-column:span 2;}

.row7{
  display:grid;
  grid-template-columns:1fr 1fr 3fr 1fr 2fr;
  gap:4px;
}

/* コピーライト（画面最下部固定） */
.footer-text {
  font-size: 10px;
  color: #ffffff; /* 文字色：白 */
  text-align: center;
  padding: 4px 0;
}
</style>
</head>

<body>

<div class="header">
  <h2>Keyboard Bahasa Sangihe</h2>
  <button id="clearAllTop">Hapus Semua</button>
</div>

<div id="editor" contenteditable="true" inputmode="none"></div>
